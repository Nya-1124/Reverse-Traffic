<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="description" content="反方向紅綠燈：按住煞車、放開前進。燈號會換，規則也會反轉。">
  <meta name="google" content="notranslate">
  <title>反方向紅綠燈</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='6' width='32' height='32' fill='%2314191e'/%3E%3Ccircle cx='16' cy='10' r='5' fill='%23e23b3b'/%3E%3Ccircle cx='16' cy='22' r='5' fill='%231f9d55'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "Noto Sans TC";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("fonts/noto-sans-tc-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Noto Sans TC";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/noto-sans-tc-700.woff2") format("woff2");
    }

    :root {
      --bg: #101418;
      --ink: #f4f1e6;
      --muted: #a8b0b6;
      --line: #2c353c;
      --sign: #f3efe4;
      --sign-ink: #171b1f;
      --red: #e23b3b;
      --green: #1f9d55;
      --yellow: #e6a817;
      --amber: #f0b429;
      --shadow: #070809;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    button, p, h1, h2 { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
    [hidden] { display: none !important; }

    #app {
      width: min(420px, 100%);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: calc(12px + env(safe-area-inset-top)) 14px calc(8px + env(safe-area-inset-bottom));
      background:
        radial-gradient(120% 40% at 50% 0%, rgba(255,255,255,0.04), transparent 55%),
        var(--bg);
      overflow: hidden;
      touch-action: none;
    }

    header, #bestLine, #storageNote, #signal, #banner, .meter-row, #hint, #pedal, #teachBar {
      flex-shrink: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .eyebrow {
      font-family: ui-sans-serif, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.2; }
    .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .timer { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
    .timer small {
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
    }
    .timer .sec { font-size: 14px; margin-left: 2px; }
    .timer.is-low { color: var(--amber); }
    #pauseBtn {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid #3a444c;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
    }
    #bestLine { color: var(--muted); font-size: 13px; line-height: 1.35; min-height: 1.35em; overflow-wrap: anywhere; }
    #storageNote { color: var(--amber); font-size: 12px; line-height: 1.4; }

    #signal { display: flex; align-items: center; gap: 10px; min-height: 96px; }
    #ruleWrap { position: relative; flex: 1; min-width: 0; height: 108px; }
    #ruleCard { height: 100%; perspective: 900px; }
    .rule-inner {
      position: relative;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.32s ease;
    }
    #ruleCard.is-reverse .rule-inner { transform: rotateY(180deg); }
    .rule-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 16px;
      border: 3px solid var(--sign-ink);
      background: var(--sign);
      box-shadow: 4px 4px 0 var(--shadow);
      backface-visibility: hidden;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }
    .rule-normal { color: #0e6b3c; }
    .rule-reverse { color: #9d1f2c; transform: rotateY(180deg); }
    @media (max-width: 380px) {
      .rule-face { font-size: 17px; gap: 4px; padding: 8px 6px; }
      .housing { width: 58px; }
      .lamp { height: 34px; }
    }
    .mini { width: 18px; height: 18px; flex: none; }
    #signal.is-broken .housing {
      border: 4px solid #ff2d2d;
      outline: 3px dashed #ff2d2d;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px #5c1216, 0 0 14px 2px #ff2d2d;
      animation: breakPulse 0.85s ease-in-out infinite;
    }
    #signal.is-broken .housing::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 6px;
      width: 14px;
      height: 18px;
      margin-left: -7px;
      pointer-events: none;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 18'><path d='M7 1 L4 8 H8 L5 17' fill='none' stroke='%23ff2d2d' stroke-width='2' stroke-linejoin='round'/></svg>") center/contain no-repeat;
    }
    @keyframes breakPulse {
      50% { box-shadow: 0 0 0 3px #ff2d2d, 0 0 20px 3px #ff2d2d; }
    }
    @media (prefers-reduced-motion: reduce) {
      #signal.is-broken .housing { animation: none; }
    }
    #rulePreview {
      margin: 4px 0 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #f6d98a;
    }
    #preLock, #lockCard {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(92%, 320px);
      max-height: calc(100% - 8px);
      transform: translate(-50%, -50%);
      z-index: 4;
      pointer-events: none;
      margin: 0;
      text-align: center;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 12px;
      border-radius: 18px;
      background: rgba(16, 18, 22, 0.92);
      color: #f6d98a;
      border: 3px solid #e6a817;
      box-shadow: 0 0 0 3px #4a3410;
    }
    #preNum { font-size: 72px; line-height: 0.9; font-weight: 700; color: #ff2d2d; }
    #lockKicker { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; }
    #lockHold { font-size: 36px; font-weight: 700; line-height: 1.05; color: #ff2d2d; }
    #lockCount { font-size: 16px; font-weight: 700; color: #f6d98a; font-variant-numeric: tabular-nums; }
    #eventActor {
      position: absolute;
      left: 50%;
      width: 128px;
      height: 56px;
      margin-left: -64px;
      z-index: 3;
      pointer-events: none;
    }
    .scene { position: absolute; inset: 0; }
    .scene svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .walk { transform-origin: 28px 28px; animation: walk 0.9s ease-in-out infinite alternate; }
    .roll { animation: roll 0.7s linear infinite; }
    .point { transform-origin: center; animation: pop 0.35s ease both; }
    .gust { animation: sweep 0.6s linear infinite; }
    .lyric {
      position: absolute;
      left: 68px;
      top: 16px;
      margin: 0;
      padding: 1px 5px;
      border-radius: 8px;
      background: #fffdf8;
      color: #171b1f;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }
    @keyframes walk { from { transform: translateX(-16px); } to { transform: translateX(14px); } }
    @keyframes roll { from { transform: translateX(0); } to { transform: translateX(36px); } }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes sweep { from { transform: translateX(-8px); } to { transform: translateX(10px); } }
    #car.is-gust { transform: rotate(-11deg) translateX(7px); }
    #car.is-gust.is-braking { transform: rotate(-11deg) translateX(7px) scale(1.04, 0.92); }
    @media (prefers-reduced-motion: reduce) {
      .walk, .roll, .point, .gust { animation: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rule-inner, .rule-reverse, #ruleCard.is-reverse .rule-inner { transform: none; transition: opacity 0.2s linear; }
      .rule-face { backface-visibility: visible; transition: opacity 0.2s linear; }
      .rule-reverse { opacity: 0; }
      .rule-normal { opacity: 1; }
      #ruleCard.is-reverse .rule-normal { opacity: 0; }
      #ruleCard.is-reverse .rule-reverse { opacity: 1; }
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .housing {
      position: relative;
      width: 70px;
      flex: none;
      padding: 7px;
      border-radius: 18px;
      background: #0c1014;
      border: 2px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lamp {
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #1a2128;
    }
    .lamp.is-on.is-red { background: var(--red); }
    .lamp.is-on.is-yellow { background: var(--yellow); }
    .lamp.is-on.is-green { background: var(--green); }
    .lamp.is-next { box-shadow: inset 0 0 0 3px #f4f1e6; }
    .shape { width: 24px; height: 24px; color: #f7f4ee; }
    .lamp:not(.is-on) .shape { opacity: 0.38; }
    #banner { min-height: 22px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    #bannerText {
      min-height: 1.2em;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    #banner.is-yellow #bannerText { color: #f6d98a; }
    #banner.is-grace #bannerText { color: #d7efe0; }
    #graceTrack { height: 6px; border-radius: 99px; background: #243028; overflow: hidden; }
    #graceFill { display: block; height: 100%; width: 100%; background: #d7efe0; transform-origin: left center; }
    #banner.is-yellow #graceTrack { background: #3a3014; }
    #banner.is-yellow #graceFill { background: var(--yellow); }

    .meter-row { display: flex; align-items: center; gap: 10px; }
    .meter { flex: 1; height: 8px; border-radius: 99px; background: #0c1014; overflow: hidden; }
    #meterFill { display: block; height: 100%; width: 0; background: var(--sign); }
    #progressText { flex: none; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }

    #hold { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
    #lane {
      position: relative;
      container-type: size;
      flex: 1 1 auto;
      min-height: 72px;
      border-radius: 18px;
      background: #1b2127;
      border: 2px solid var(--line);
      overflow: hidden;
    }
    #lane::before, #lane::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      background: #efe8d4;
    }
    #lane::before { left: 8px; }
    #lane::after { right: 8px; }
    #lane[data-rule="reverse"]::before,
    #lane[data-rule="reverse"]::after {
      background: repeating-linear-gradient(
        135deg,
        #efe8d4 0 5px,
        #1b2127 5px 10px
      );
    }
    #laneBadge {
      position: absolute;
      top: 34px;
      right: 22px;
      width: 22px;
      height: 22px;
      z-index: 2;
      pointer-events: none;
    }
    #laneBadge span,
    #laneBadge span::before {
      position: absolute;
      left: 3px;
      right: 3px;
      top: 9px;
      height: 3px;
      background: #efe8d4;
      border-radius: 2px;
    }
    #lane[data-rule="reverse"] #laneBadge span { transform: rotate(32deg); }
    #lane[data-rule="reverse"] #laneBadge span::before { content: ""; transform: rotate(-64deg); }
    #lockMark {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 92px;
      height: 92px;
      margin-left: -46px;
      z-index: 3;
      pointer-events: none;
      display: grid;
      place-items: center;
    }
    #lockMark svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #lockRing, .ring-bg { fill: none; stroke-width: 6; }
    .ring-bg { stroke: #2c353c; }
    #lockRing {
      stroke: #f4f1e6;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .shackle {
      width: 22px;
      height: 14px;
      border: 4px solid #f4f1e6;
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      margin: 0 auto;
    }
    .lock-body {
      width: 30px;
      height: 22px;
      margin: -2px auto 0;
      background: #f4f1e6;
      border-radius: 4px;
    }
    #lockLabel {
      position: absolute;
      bottom: -2px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    #lockMark.is-warn { opacity: 0.9; }
    #lockMark.is-warn #lockRing { stroke: var(--yellow); }
    #lockMark.is-unlock .shackle { animation: unlock 0.35s ease forwards; }
    @keyframes unlock {
      to { transform: translate(4px, -7px) rotate(36deg); transform-origin: left bottom; }
    }
    @media (prefers-reduced-motion: reduce) {
      #lockMark.is-unlock .shackle { animation: none; }
    }
    .finish {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: repeating-linear-gradient(90deg, #f3efe4 0 8px, #1a1e22 8px 16px);
      z-index: 1;
    }
    .finish span {
      background: #1a1e22;
      color: #f3efe4;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      padding: 2px 8px;
      border-radius: 999px;
    }
    #dashes {
      position: absolute;
      top: 36px;
      bottom: 10px;
      left: 50%;
      width: 4px;
      margin-left: -2px;
      background-image: repeating-linear-gradient(to bottom, #efe8d4 0 10px, transparent 10px 22px);
      opacity: 0.75;
    }
    #car {
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: 34px;
      height: 34px;
      margin-left: -17px;
      border-radius: 8px;
      background: var(--sign);
      border: 2px solid #171b1f;
      box-shadow: 3px 3px 0 var(--shadow);
      z-index: 2;
    }
    #car .nose {
      position: absolute;
      top: 6px;
      left: 7px;
      right: 7px;
      height: 6px;
      border-radius: 2px;
      background: #171b1f;
    }
    #car .lights {
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    #car .lights i {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      background: #6a3a3e;
    }
    #car.is-braking { transform: scale(1.04, 0.92); }
    #car.is-braking .lights i { background: var(--red); box-shadow: 0 0 8px var(--red); }
    #car.is-moving { animation: bob 0.45s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #car.is-moving { animation: none; }
    }

    #pedal {
      flex: none;
      min-height: 124px;
      border-radius: 18px;
      border: 3px solid var(--sign);
      background: #242a31;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 6px 0 var(--shadow);
      transition: transform 80ms ease, box-shadow 80ms ease, background-color 80ms ease;
    }
    #pedal.is-held {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--shadow);
      background: #3a2226;
    }
    .brake-lamp {
      width: 48px;
      height: 8px;
      border-radius: 99px;
      background: #5a3034;
      margin-bottom: 4px;
    }
    #pedal.is-held .brake-lamp { background: var(--red); box-shadow: 0 0 12px rgba(226, 59, 59, 0.85); }
    .pedal-title { font-size: 28px; font-weight: 700; }
    .pedal-sub { font-size: 14px; color: #d5dbe0; min-height: 1.2em; }

    #hint {
      color: #d7dee4;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }
    #app[data-mode="teaching"] #hint { display: none; }
    #app[data-mode="won"] #hint,
    #app[data-mode="lost"] #hint,
    #app[data-mode="paused"] #hint { visibility: hidden; }
    .kb { display: none; }
    @media (hover: hover) and (pointer: fine) {
      .kb { display: inline; }
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 18px 16px 22px;
      background: linear-gradient(to bottom, rgba(8, 10, 12, 0.04) 0%, rgba(8, 10, 12, 0.62) 30%, #101418 68%);
    }
    .card {
      width: min(100%, 360px);
      background: var(--sign);
      color: var(--sign-ink);
      border: 3px solid var(--sign-ink);
      border-radius: 18px;
      padding: 18px 18px 16px;
      box-shadow: 6px 6px 0 var(--shadow);
    }
    .card-kicker { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
    .card[data-kind="lose"] .card-kicker { color: #9d1f2c; }
    .card[data-kind="win"] .card-kicker { color: #0e6b3c; }
    #cardTitle { font-size: 32px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
    #cardDetail, #cardMeta { margin-top: 8px; font-size: 16px; line-height: 1.45; }
    #cardMeta { font-weight: 700; }
    #cardBtn, #menuBtn, #startBtn, #menu button {
      width: 100%;
      height: 52px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: var(--sign-ink);
      color: var(--sign);
      font-size: 18px;
      font-weight: 700;
    }
    #menuBtn { background: transparent; color: var(--sign-ink); border: 2px solid var(--sign-ink); }
    #menu {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      gap: 0;
      padding: 16px 18px 18px;
      overflow-y: auto;
      background: #f4f0e6;
      color: #171b1f;
      color-scheme: light;
    }
    #menu h2 { font-size: 26px; font-weight: 700; margin: 0 0 8px; color: #171b1f; }
    #menu button {
      min-height: 46px;
      height: auto;
      margin-top: 4px;
      padding: 8px 12px;
      line-height: 1.25;
      white-space: normal;
      background: #fffdf8;
      color: #171b1f;
      border: 2px solid #171b1f;
      box-shadow: 3px 3px 0 #171b1f;
    }
    #menu .lvl-best { margin: 2px 0 6px; color: #3a342c; font-size: 13px; font-weight: 700; }
    #menu .lvl-sub { margin: 1px 2px 4px; color: #3a342c; font-size: 13px; font-weight: 700; line-height: 1.3; }
    #replayBtn {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      border-radius: 12px;
      border: 2px solid #171b1f;
      background: #fffdf8;
      color: #171b1f;
      font-size: 17px;
      font-weight: 700;
    }
    .teach-row { display: flex; gap: 8px; margin-top: 8px; }
    #skipBtn, #teachMenu {
      flex: 1 1 0;
      width: auto;
      min-width: 0;
      height: 44px;
      margin-top: 0;
      border-radius: 12px;
      border: 2px solid #171b1f;
      background: #fffdf8;
      color: #171b1f;
      font-size: 16px;
      font-weight: 700;
    }
    #teachBar {
      flex: none;
      background: #fffdf8;
      color: #171b1f;
      border-radius: 14px;
      padding: 10px 12px;
      border: 3px solid #171b1f;
    }
    #teachText { font-size: 18px; font-weight: 700; line-height: 1.35; color: #171b1f; }

    @media (min-width: 860px) {
      body {
        display: grid;
        place-items: center;
        background-color: #0c0f12;
        background-image:
          linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      #app {

            if (nt > t - 0.95) break;
            if (!push(nt, signal === "green" ? "red" : "green", rule)) break;
          }
        }
        var startWin = 3.55;
        var endWin = 56.4;
        var slot = (endWin - startWin) / pieces.length;
        for (var p = 0; p < pieces.length; p++) {
          var piece = pieces[p];
          var anchor = round3(startWin + slot * p + slot * 0.28 + rf(-slot * 0.08, slot * 0.08));
          if (piece.type === "flip") {
            fillerUntil(anchor);
            var ft = Math.max(anchor, now + yellow + 0.55, busyUntil + yellow + 0.22);
            if (ft > limit - 2.5) break;
            var nextRule = rule === "normal" ? "reverse" : "normal";
            var makeGo = rand() < 0.62;
            if (!push(ft, makeGo ? goSig(nextRule) : stopSig(nextRule), nextRule)) break;
            busyUntil = round3(now + 0.72);
          } else if (piece.type === "event") {
            fillerUntil(anchor - 0.15);
            if (!isGo(signal, rule)) {
              var gt = Math.max(anchor - 0.1, now + yellow + 0.5, busyUntil + yellow + 0.16);
              if (!push(gt, goSig(rule), rule)) break;
            }
            var et = round3(Math.max(now + yellow + 0.36, busyUntil + EVENT_LEAD + 0.58, 3.6));
            if (et + 1.5 > limit - 2.05) break;
            evs.push({ t: et, react: 0.5, dur: 1.5, id: piece.id });
            busyUntil = round3(et + 1.5 + 0.58);
          } else {
            fillerUntil(anchor);
            var lt = Math.max(anchor, now + yellow + 0.5, busyUntil + yellow + 0.16);
            var hostGo = rand() < 0.55;
            if (!push(lt, hostGo ? goSig(rule) : stopSig(rule), rule)) break;
            var ls = round3(now + rf(0.42, 0.58));
            var changeAt = round3(ls + rf(0.95, 1.18));
            if (changeAt > limit - 3.1) break;
            if (!push(changeAt, signal === "green" ? "red" : "green", rule)) break;
            var le = round3(now + rf(0.58, 0.78));
            if (le > limit - 2.05 || le < ls + 1.4) break;
            locks.push({ warn: ls, start: ls, end: le });
            busyUntil = round3(le + 0.58);
          }
        }
        fillerUntil(limit - 2.35);
        return {
          name: "頂～邊有可能",
          yellow: yellow,
          react: 0.32,
          limit: limit,
          move: 8,
          locks: locks,
          events: evs,
          lights: lights
        };
      }

      function generateChallenge(seed) {
        var base = seed >>> 0;
        var best = null;
        for (var attempt = 0; attempt < 24; attempt++) {
          var draft = buildChallenge(mulberry32((base + attempt * 9973) >>> 0));
          draft.seed = base;
          draft.problems = auditChallenge(draft);
          var perf = simFinal(draft, "perf");
          var prompt = simFinal(draft, "prompt");
          var hesitant = simFinal(draft, "hesitant");
          var move = perf.died ? 0 : perf.moved * 0.78;
          if (!prompt.died && move > prompt.moved - 0.4) move = Math.max(0, prompt.moved - 0.45);
          draft.move = Math.round(Math.max(8, move) * 100) / 100;
          draft.perf = perf.moved;
          draft.prompt = prompt.moved;
          draft.hesitant = hesitant.moved;
          draft.perfDied = perf.died;
          draft.promptDied = prompt.died;
          draft.hesitantDied = hesitant.died;
          var promptCourse = simFinal(draft, "prompt");
          var hesitantCourse = simFinal(draft, "hesitant");
          draft.promptWon = !promptCourse.died && promptCourse.moved + 1e-6 >= draft.move;
          draft.hesitantWon = !hesitantCourse.died && hesitantCourse.moved + 1e-6 >= draft.move;
          if (perf.died || prompt.died || !draft.promptWon) draft.problems = draft.problems.concat(["unfair"]);
          if (!best || draft.problems.length < best.problems.length) best = draft;
          if (draft.problems.length === 0 && draft.promptWon) return draft;
        }
        return best;
      }

      var finalSpec = null;
      var finalSeed = 0;
      var finalRun = 0;
      var forcedSeed = null;
      var mixSpec = null;
      var mixSeed = 0;
      var mixRun = 0;
      var forcedMix = null;
      var challengeSpec = null;
      var challengeSeed = 0;
      var challengeRun = 0;
      var forcedChallenge = null;
      var urlSeed = null;
      try {
        var seedParam = new URLSearchParams(location.search).get("seed");
        if (seedParam != null && seedParam !== "" && !isNaN(Number(seedParam))) urlSeed = Number(seedParam) >>> 0;
      } catch (err) { urlSeed = null; }
      function nextFinalSeed() {
        if (forcedSeed != null) {
          var picked = forcedSeed >>> 0;
          forcedSeed = null;
          return picked;
        }
        if (urlSeed != null) return (urlSeed + finalRun++) >>> 0;
        return (Math.floor(Math.random() * 0x7fffffff)) >>> 0;
      }
      function nextMixSeed() {
        if (forcedMix != null) {
          var picked = forcedMix >>> 0;
          forcedMix = null;
          return picked;
        }
        if (urlSeed != null) return (urlSeed + mixRun++) >>> 0;
        return (Math.floor(Math.random() * 0x7fffffff)) >>> 0;
      }
      function nextChallengeSeed() {
        if (forcedChallenge != null) {
          var picked = forcedChallenge >>> 0;
          forcedChallenge = null;
          return picked;
        }
        if (urlSeed != null) return (urlSeed + challengeRun++) >>> 0;
        return (Math.floor(Math.random() * 0x7fffffff)) >>> 0;
      }
      function applyLevel(id) {
        var spec = LEVELS[id];
        if (id === "mix" && mixSpec) spec = mixSpec;
        if (id === "final" && finalSpec) spec = finalSpec;
        if (id === "challenge" && challengeSpec) spec = challengeSpec;
        levelId = id;
        YELLOW = spec.yellow;
        REACT = spec.react;
        MOVE_RATE = 100 / spec.move;
        LOCKS = spec.locks || [];
        EVENTS = spec.events || [];
        TIME_LIMIT = spec.limit || 30;
        PHASES = [];
        for (var i = 0; i < spec.lights.length; i++) {
          if (i > 0) {
            PHASES.push({
              t: Math.round((spec.lights[i].t - spec.yellow) * 1000) / 1000,
              signal: "yellow",
              rule: spec.lights[i - 1].rule
            });
          }
          PHASES.push(spec.lights[i]);
        }
      }

      function phaseAt(t) {
        var index = 0;
        for (var i = 0; i < PHASES.length; i++) {
          if (t + 1e-9 >= PHASES[i].t) index = i;
        }
        return {
          index: index,
          phase: PHASES[index],
          next: index + 1 < PHASES.length ? PHASES[index + 1] : null
        };
      }

      function requiredOf(phase) {
        if (!phase || phase.signal === "yellow") return "either";
        var go = phase.rule === "normal" ? phase.signal === "green" : phase.signal === "red";
        return go ? "go" : "stop";
      }

      function formatSeconds(seconds) {
        return (Math.round(seconds * 10) / 10).toFixed(1);
      }

      function setText(el, text) {
        if (el.textContent !== text) el.textContent = text;
      }

      function loadBest() {
        var raw = null;
        try {
          raw = localStorage.getItem(STORAGE_KEY);
        } catch (err) {
          storageOk = false;
          return;
        }
        if (!raw) return;
        try {
          var data = JSON.parse(raw);
          if (!data || typeof data !== "object") return;
          if (data.v === 2 && data.levels) {
            ["normal", "reverse", "lock", "mix", "event", "final", "challenge"].forEach(function (key) {
              var item = data.levels[key];
              if (!item) return;
              if (typeof item.bestTimeMs === "number" && item.bestTimeMs > 0 && item.bestTimeMs < 120000) bests[key].bestTimeMs = item.bestTimeMs;
              if (typeof item.bestProgress === "number" && item.bestProgress > 0 && item.bestProgress <= 100) bests[key].bestProgress = item.bestProgress;
            });
          } else if (typeof data.bestTimeMs === "number" || typeof data.bestProgress === "number") {
            if (typeof data.bestTimeMs === "number" && data.bestTimeMs > 0 && data.bestTimeMs < 120000) bests.mix.bestTimeMs = data.bestTimeMs;
            if (typeof data.bestProgress === "number" && data.bestProgress > 0 && data.bestProgress <= 100) bests.mix.bestProgress = data.bestProgress;
          }
        } catch (err) {
          return;
        }
      }

      function saveBest() {
        if (!storageOk) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ v: 2, levels: bests }));
        } catch (err) {
          storageOk = false;
        }
      }

      function scoreText(item) {
        if (!item) return "尚無紀錄";
        if (item.bestTimeMs != null) return "最佳 " + formatSeconds(item.bestTimeMs / 1000) + " 秒";
        if (item.bestProgress > 0) return "最佳進度 " + Math.floor(item.bestProgress) + "%";
        return "尚無紀錄";
      }

      function bestLabel() {
        if (mode === "menu") return "可直接選關";
        return LEVELS[levelId].name + " · " + scoreText(slot());
      }

      function paintMenu() {
        setText(document.getElementById("bestNormal"), scoreText(bests.normal));
        setText(document.getElementById("bestReverse"), scoreText(bests.reverse));
        setText(document.getElementById("bestLock"), scoreText(bests.lock));
        setText(document.getElementById("bestMix"), scoreText(bests.mix));
        setText(document.getElementById("bestEvent"), scoreText(bests.event));
        setText(document.getElementById("bestFinal"), scoreText(bests.final));
        setText(document.getElementById("bestChallenge"), scoreText(bests.challenge));
      }

      function rememberProgress() {
        var value = Math.round(progress * 10) / 10;
        if (value > (slot().bestProgress || 0)) slot().bestProgress = value;
        saveBest();
      }

      function inputsArmed() {
        return performance.now() >= inputArmedAt;
      }

      function syncBraking() {
        if (mode !== "playing" && mode !== "teaching") {
          braking = false;
          return;
        }
        if (debugBrake !== null) {
          braking = debugBrake;
          return;
        }
        if (!inputsArmed()) {
          braking = false;
          return;
        }
        braking = spaceHeld || pointers.size > 0;
      }

      function lockAt(t) {
        for (var i = 0; i < LOCKS.length; i++) {
          if (t >= LOCKS[i].start && t < LOCKS[i].end) return { index: i, phase: "active", lock: LOCKS[i] };
          if (t >= LOCKS[i].warn && t < LOCKS[i].start) return { index: i, phase: "warn", lock: LOCKS[i] };
        }
        return null;
      }

      function releaseInputs() {
        spaceHeld = false;
        pointers.clear();
        debugBrake = null;
        syncBraking();
      }

      function failLock(held) {
        mode = "lost";
        result = {
          kind: "lock",
          kicker: "出局",
          title: held ? "要保持停止" : "要保持通行",
          detail: held ? "你個嘢壞咗，要保持停止，你放開了。" : "你個嘢壞咗，要保持通行，你按住了。",
          meta: "進度 " + Math.floor(progress) + "%"
        };
        releaseInputs();
        rememberProgress();
      }

      function failEvent(ev) {
        mode = "lost";
        var copy = EVENT_COPY[ev.id] || EVENT_COPY.grandma;
        result = {
          kind: "event",
          kicker: "喂喂喂 嚇死人咩",
          title: "這時必須停止",
          detail: copy.detail,
          meta: "進度 " + Math.floor(progress) + "%"
        };
        releaseInputs();
        rememberProgress();
      }

      function eventAt(t) {
        for (var i = 0; i < EVENTS.length; i++) {
          var ev = EVENTS[i];
          var end = ev.t + ev.dur;
          if (t >= ev.t && t < end) {
            return { index: i, phase: t < ev.t + ev.react ? "react" : "stop", event: ev };
          }
        }
        return null;
      }

      function eventVisual(t) {
        for (var i = 0; i < EVENTS.length; i++) {
          var ev = EVENTS[i];
          if (t >= ev.t - EVENT_LEAD && t < ev.t + ev.dur) return EVENTS[i];
        }
        return null;
      }

      function failMove(phase) {
        mode = "lost";
        var detail = "燈號不符合目前規則，你還在前進。";
        if (phase.rule === "normal" && phase.signal === "red") {
          detail = "正常規則：紅燈要停，你還在前進。";
        } else if (phase.rule === "reverse" && phase.signal === "green") {
          detail = "反轉規則：綠燈要停，你還在前進。";
        }
        result = {
          kind: "move",
          kicker: "出局",
          title: "這時必須停止",
          detail: detail,
          meta: "進度 " + Math.floor(progress) + "%"
        };
        releaseInputs();
        rememberProgress();
      }

      function failTime() {
        mode = "lost";
        var limit = roundLimit();
        var detail = progress < 15
          ? "一直按住煞車會停住。" + limit + " 秒內要走到終點。"
          : limit + " 秒到了，還沒走到終點。";
        result = {
          kind: "time",
          kicker: "時間到",
          title: "還沒抵達終點",
          detail: detail,
          meta: "進度 " + Math.floor(progress) + "%"
        };
        releaseInputs();
        rememberProgress();
      }

      function win() {
        mode = "won";
        progress = 100;
        var ms = Math.round(elapsed * 1000);
        var prev = slot().bestTimeMs;
        var improved = prev == null || ms < prev;
        if (improved) slot().bestTimeMs = ms;
        slot().bestProgress = 100;
        saveBest();
        result = {
          kind: "win",
          kicker: "抵達終點",
          title: formatSeconds(elapsed) + " 秒",
          detail: improved ? "更新最佳紀錄。" : "最佳仍是 " + formatSeconds(prev / 1000) + " 秒。",
          meta: "這一局在時限內走到終點。"
        };
        releaseInputs();
      }

      function stepOnce(dt) {
        if (mode !== "playing") return;
        elapsed += dt;
        var info = phaseAt(elapsed);
        if (info.index !== phaseIndex) {
          phaseIndex = info.index;
          if (!info.phase.safe && info.phase.signal !== "yellow") graceUntil = info.phase.t + REACT;
        }
        var wasResume = resumeGraceLeft > 0;
        if (resumeGraceLeft > 0) resumeGraceLeft = Math.max(0, resumeGraceLeft - dt);
        var lk = lockAt(elapsed);
        var lockActive = !!(lk && lk.phase === "active");
        if (!lockActive) {
          for (var li = 0; li < LOCKS.length; li++) {
            if (elapsed - dt < LOCKS[li].end && elapsed >= LOCKS[li].end) {
              graceUntil = Math.max(graceUntil, elapsed + Math.max(REACT, 0.45));
            }
          }
          seenLock = -1;
          lockSnap = null;
        } else if (!wasResume) {
          if (seenLock !== lk.index) {
            seenLock = lk.index;
            lockSnap = null;
          }
          var lockAge = elapsed - lk.lock.start;
          if (lockAge >= LOCK_ONSET && lockSnap === null) lockSnap = braking;
          else if (lockSnap !== null && braking !== lockSnap) {
            failLock(lockSnap);
            return;
          }
        }
        for (var ei = 0; ei < EVENTS.length; ei++) {
          var evEnd = EVENTS[ei].t + EVENTS[ei].dur;
          if (elapsed - dt < evEnd && elapsed >= evEnd) {
            graceUntil = Math.max(graceUntil, elapsed + Math.max(REACT, 0.45));
          }
        }
        var evNow = eventAt(elapsed);
        var moving = !braking && !wasResume;
        if (evNow && evNow.phase === "stop" && !wasResume && moving) {
          failEvent(evNow.event);
          return;
        }
        var req = requiredOf(info.phase);
        var protectedTime = !!info.phase.safe || info.phase.signal === "yellow" || wasResume || lockActive || !!evNow || elapsed < graceUntil;
        if (!protectedTime && req === "stop" && moving) {
          failMove(info.phase);
          return;
        }
        if (moving) {
          progress += MOVE_RATE * dt;
          dashOffset = (dashOffset + 80 * dt) % 22;
          if (progress >= 100) {
            progress = 100;
            win();
            return;
          }
        }
        if (elapsed >= roundLimit() && progress < 100) failTime();
      }

      function teachStep() {
        return TEACH[levelId][teach.step];
      }

      function teachTick(dt) {
        var step = teachStep();
        if (!step || teach.ready) return;
        if (!braking) {
          var rate = step.kind === "release" ? 120 : step.kind === "lock" ? 15 : 90;
          var cap = step.kind === "lock" ? 58 : 88;
          progress = Math.min(cap, progress + rate * dt);
          dashOffset = (dashOffset + 260 * dt) % 22;
        }
        if (step.kind === "release") {
          if (!braking) teach.acc += dt;
          else teach.acc = 0;
          if (teach.acc > 0.65 && progress > 55) finishTeachStep();
        } else if (step.kind === "brake" || step.kind === "event") {
          if (braking) teach.acc += dt;
          else teach.acc = 0;
          if (teach.acc > (step.kind === "event" ? 0.45 : 0.35)) finishTeachStep();
        } else if (step.kind === "lock") {
          var wanted = !!step.force;
          if (teach.phase === "choose" || teach.phase === "count") {
            if (braking === wanted) teach.acc += dt;
            else teach.acc = 0;
            if (teach.acc > 0.35) {
              teach.captured = braking;
              teach.phase = "keep";
              teach.acc = 0;
            }
          } else if (braking === teach.captured) {
            teach.acc += dt;
            if (teach.acc > 1.7) finishTeachStep();
          } else {
            teach.acc = 0;
          }
        }
      }

      function finishTeachStep() {
        if (teach.step < TEACH[levelId].length - 1) {
          teach.step += 1;
          teach.acc = 0;
          teach.phase = "choose";
          teach.captured = null;
          teach.ready = false;
          teach.lastBrake = braking;
          startBtn.hidden = true;
          var nextStep = teachStep();
          var holdPose = nextStep.kind === "brake" || nextStep.kind === "event" || (nextStep.kind === "lock" && nextStep.force);
          progress = holdPose ? 46 : 8;
        } else {
          teach.ready = true;
          startBtn.hidden = false;
          setText(teachText, "練習完成。按開始挑戰。");
        }
      }

      function update(dt) {
        if (!Number.isFinite(dt) || dt <= 0) return;
        if (mode === "teaching") {
          teachTick(dt);
          return;
        }
        var left = dt;
        while (left > 0 && mode === "playing") {
          var step = Math.min(0.05, left);
          stepOnce(step);
          left -= step;
        }
      }

      function warningText() {
        if (resumeGraceLeft > 0 && mode === "playing") return "反應時間";
        var lk = lockAt(elapsed);
        return "";
      }

      function graceRatio() {
        if (resumeGraceLeft > 0) return resumeGraceLeft / RESUME_GRACE;
        var evGrace = eventAt(elapsed);
        if (evGrace && evGrace.phase === "react") {
          return Math.max(0, Math.min(1, (evGrace.event.t + evGrace.event.react - elapsed) / evGrace.event.react));
        }
        var info = phaseAt(elapsed);
        if (info.phase.signal === "yellow" && info.next) {
          return Math.max(0, Math.min(1, (info.next.t - elapsed) / YELLOW));
        }
        return 0;
      }

      function paintLockWord(held) {
        setText(lockHold, held ? "保持停止" : "保持通行");
      }

      function showScene(el, on) {
        if (on) el.removeAttribute("hidden");
        else el.setAttribute("hidden", "");
      }

      function paintActor(id) {
        eventActor.dataset.kind = id;
        showScene(sceneGrandma, id === "grandma");
        showScene(sceneSpidey, id === "spidey");
        showScene(sceneWind, id === "wind");
      }

      function placeActor() {
        var laneH = lane.clientHeight || 0;
        var travel = Math.max(0, laneH - 34 - 36);
        var carBottom = 8 + (Math.max(0, Math.min(100, progress)) / 100) * travel;
        var nose = carBottom + 36;
        var want = nose + 8;
        var maxBottom = Math.max(nose, laneH - 60);
        eventActor.style.bottom = Math.max(8, Math.min(want, maxBottom)) + "px";
      }

      function movingNow() {
        if (mode === "teaching") return !braking;
        return mode === "playing" && !braking && resumeGraceLeft <= 0;
      }

      function render() {
        var info = phaseAt(Math.max(0, elapsed));
        var phase = info.phase;
        var teaching = mode === "teaching" || (mode === "paused" && pausedFrom === "teaching");
        if (teaching) {
          var step = teachStep();
          var teachSignal = step.signal;
          if (!teach.ready && step.kind === "lock" && teach.phase === "keep") {
            if (teach.acc >= 1.05) teachSignal = step.signal === "green" ? "red" : "green";
            else if (teach.acc >= 0.55) teachSignal = "yellow";
          }
          phase = { signal: teachSignal, rule: step.rule, safe: true };
          info = { phase: phase, next: null, index: 0 };
        }
        var req = requiredOf(phase);
        var warn = mode === "playing" ? warningText() : "";
        var ratio = mode === "playing" ? graceRatio() : 0;
        var moving = movingNow();
        var remain = Math.max(0, roundLimit() - elapsed);

        app.dataset.mode = mode;
        app.dataset.signal = phase.signal;
        app.dataset.rule = phase.rule;
        app.dataset.required = req;

        if (mode === "playing" || (mode === "paused" && pausedFrom === "playing")) {
          setText(timeCaption, "剩餘");
          setText(timeValue, formatSeconds(remain));
          timer.querySelector(".sec").hidden = false;
        } else {
          setText(timeCaption, "教學");
          setText(timeValue, "—");
          timer.querySelector(".sec").hidden = true;
        }
        timer.classList.toggle("is-low", mode === "playing" && remain <= 5);
        setText(bestLine, bestLabel());
        storageNote.hidden = storageOk;

        var reverse = phase.rule === "reverse";
        var upcoming = phase.signal === "yellow" && info.next && info.next.rule !== phase.rule;
        ruleCard.classList.toggle("is-reverse", reverse);
        rulePreview.hidden = !upcoming;
        if (upcoming) setText(rulePreview, info.next.rule === "reverse" ? "即將反轉" : "即將恢復");
        lane.dataset.rule = reverse ? "reverse" : "normal";
        app.dataset.ruleShown = reverse ? "reverse" : "normal";

        var nextSig = phase.signal === "yellow" && info.next ? info.next.signal : "";
        lampRed.classList.toggle("is-on", phase.signal === "red");
        lampYellow.classList.toggle("is-on", phase.signal === "yellow");
        lampGreen.classList.toggle("is-on", phase.signal === "green");
        lampRed.classList.toggle("is-next", nextSig === "red");
        lampYellow.classList.toggle("is-next", false);
        lampGreen.classList.toggle("is-next", nextSig === "green");
        setText(lampName, phase.signal === "red" ? "紅燈" : phase.signal === "yellow" ? "黃燈" : "綠燈");

        setText(bannerText, warn);
        banner.classList.toggle("is-yellow", phase.signal === "yellow" && warn !== "反應時間");
        banner.classList.toggle("is-grace", warn === "反應時間");
        graceTrack.hidden = ratio <= 0;
        graceFill.style.transform = "scaleX(" + ratio.toFixed(4) + ")";

        var shown = Math.floor(progress);
        setText(progressText, "進度 " + shown + "%");
        meterFill.style.width = Math.max(0, Math.min(100, progress)) + "%";
        meter.setAttribute("aria-valuenow", String(shown));

        var laneH = lane.clientHeight;
        var travel = Math.max(0, laneH - 34 - 36);
        car.style.bottom = (8 + (progress / 100) * travel) + "px";
        dashes.style.backgroundPositionY = dashOffset.toFixed(2) + "px";
        var lkNow = (!teaching && (mode === "playing" || mode === "paused")) ? lockAt(elapsed) : null;
        var lockActive = !!(lkNow && lkNow.phase === "active");
        var teachKeep = teaching && !teach.ready && teachStep() && teachStep().kind === "lock" && teach.phase === "keep";
        preLock.hidden = true;
        lockCard.hidden = true;
        signal.classList.toggle("is-broken", lockActive || teachKeep);
        var teachEvent = teaching && !teach.ready && teachStep() && teachStep().kind === "event" ? teachStep().event : "";
        var evShown = (!teaching && (mode === "playing" || (mode === "paused" && pausedFrom === "playing"))) ? eventVisual(elapsed) : null;
        var actorId = evShown ? evShown.id : teachEvent;
        eventActor.hidden = !actorId;
        if (actorId) {
          paintActor(actorId);
          placeActor();
        }
        car.classList.toggle("is-gust", actorId === "wind");

        car.classList.toggle("is-moving", moving);
        car.classList.toggle("is-braking", braking);
        pedal.classList.toggle("is-held", braking);
        setText(pedalSub, braking ? "煞車中" : moving ? "前進中" : "放開前進");
        pauseBtn.hidden = mode !== "playing" && mode !== "teaching";

        var cardModel = null;
        if (mode === "paused") {
          var pausedLock = lockAt(elapsed);
          if (pausedLock && pausedLock.phase === "active" && lockSnap !== null) {
            cardModel = {
              kind: "pause",
              kicker: "已暫停",
              title: "你個嘢壞咗",
              detail: lockSnap ? "保持停止" : "保持通行",
              meta: "",
              btn: "繼續"
            };
          } else {
            cardModel = {
              kind: "pause",
              kicker: "已暫停",
              title: "時間不會流逝",
              detail: "繼續後有一小段反應時間。",
              meta: "",
              btn: "繼續"
            };
          }
        } else if (result) {
          cardModel = {
            kind: result.kind === "win" ? "win" : "lose",
            kicker: result.kicker,
            title: result.title,
            detail: result.detail,
            meta: result.meta,
            btn: "再來一局"
          };
        }

        menu.hidden = mode !== "menu";
        teachBar.hidden = !teaching;
        if (teaching && !teach.ready) setText(teachText, teachStep().text);
        if (mode === "menu") paintMenu();

        if (cardModel) {
          card.dataset.kind = cardModel.kind;
          setText(cardKicker, cardModel.kicker);
          setText(cardTitle, cardModel.title);
          setText(cardDetail, cardModel.detail);
          setText(cardMeta, cardModel.meta);
          cardMeta.hidden = cardModel.meta === "";
          setText(cardBtn, cardModel.btn);
          replayBtn.hidden = !(mode === "won" || mode === "lost");
          if (!overlayOpen) {
            overlay.hidden = false;
            overlayOpen = true;
            queueMicrotask(function () {
              try { cardBtn.focus({ preventScroll: true }); } catch (err) { cardBtn.focus(); }
            });
          }
        } else if (overlayOpen) {
          overlay.hidden = true;
          overlayOpen = false;
          replayBtn.hidden = true;
        }
      }

      function showMenu() {
        mode = "menu";
        result = null;
        teach.ready = false;
        releaseInputs();
        render();
      }

      function beginTeach(id) {
        applyLevel(id);
        mode = "teaching";
        pausedFrom = "teaching";
        elapsed = 0;
        progress = 0;
        phaseIndex = 0;
        graceUntil = 0;
        resumeGraceLeft = 0;
        lockSnap = null;
        seenLock = -1;
        result = null;
        teach = { step: 0, acc: 0, ready: false, phase: "choose", captured: null, countLeft: 3, lastBrake: false };
        progress = 8;
        startBtn.hidden = true;
        releaseInputs();
        inputArmedAt = performance.now() + 180;
        setText(teachText, TEACH[id][0].text);
        render();
      }

      function freshChallenge() {
        if (levelId === "mix") {
          mixSpec = generateMix(nextMixSeed());
          mixSeed = mixSpec.seed;
        } else if (levelId === "final") {
          finalSpec = generateFinal(nextFinalSeed());
          finalSeed = finalSpec.seed;
        } else if (levelId === "challenge") {
          challengeSpec = generateChallenge(nextChallengeSeed());
          challengeSeed = challengeSpec.seed;
        }
        applyLevel(levelId);
        mode = "playing";
        pausedFrom = "playing";
        elapsed = 0;
        progress = 0;
        phaseIndex = 0;
        graceUntil = 0;
        resumeGraceLeft = 0;
        lockSnap = null;
        seenLock = -1;
        result = null;
        teach.ready = false;
        startBtn.hidden = true;
        releaseInputs();
        inputArmedAt = performance.now() + 240;
        lastTs = performance.now();
        render();
      }

      function beginChallenge() {
        if (mode !== "teaching" || !teach.ready) return;
        freshChallenge();
      }

      function enterPause(reason) {
        if (mode !== "playing" && mode !== "teaching") return;
        if (mode !== "paused") {
          pausedFrom = mode;
          mode = "paused";
          pausedReason = reason || "manual";
        }
        releaseInputs();
        render();
      }

      function resume() {
        if (mode !== "paused") return;
        mode = pausedFrom === "teaching" ? "teaching" : "playing";
        pausedReason = "";
        if (mode === "playing") resumeGraceLeft = RESUME_GRACE;
        releaseInputs();
        inputArmedAt = performance.now() + 180;
        lastTs = performance.now();
        render();
      }

      function restart() {
        if (levelId && LEVELS[levelId]) freshChallenge();
        else showMenu();
      }

      function onPointerDown(event) {
        if (mode !== "playing" && mode !== "teaching") return;
        if (!inputsArmed()) return;
        if (event.target.closest("[data-no-brake]")) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        event.preventDefault();
        pointers.add(event.pointerId);
        try { app.setPointerCapture(event.pointerId); } catch (err) {}
        syncBraking();
        render();
      }

      app.addEventListener("pointerdown", onPointerDown, { passive: false });
      window.addEventListener("pointerup", function (event) {
        pointers.delete(event.pointerId);
        syncBraking();
        render();
      });
      window.addEventListener("pointercancel", function () {
        pointers.clear();
        if (mode === "playing" || mode === "teaching") enterPause("cancel");
        else { syncBraking(); render(); }
      });
      app.addEventListener("lostpointercapture", function (event) {
        pointers.delete(event.pointerId);
        syncBraking();
        render();
      });
      window.addEventListener("touchend", function (event) {
        if (event.touches.length === 0) {
          pointers.clear();
          syncBraking();
          render();
        }
      }, { passive: true });
      window.addEventListener("touchcancel", function () {
        pointers.clear();
        if (mode === "playing" || mode === "teaching") enterPause("cancel");
        else { syncBraking(); render(); }
      }, { passive: true });
      window.addEventListener("contextmenu", function (event) { event.preventDefault(); });

      window.addEventListener("keydown", function (event) {
        if (event.code === "Escape") {
          event.preventDefault();
          if (mode === "playing" || mode === "teaching") enterPause("manual");
          return;
        }
        if (event.code !== "Space" && event.code !== "Enter") return;
        event.preventDefault();
        if (event.repeat) return;
        if (mode === "won" || mode === "lost") {
          restart();
          return;
        }
        if (mode === "paused") {
          resume();
          return;
        }
        if (!inputsArmed()) return;
        if (event.code === "Space") {
          spaceHeld = true;
          syncBraking();
          render();
        }
      });
      window.addEventListener("keyup", function (event) {
        if (event.code !== "Space") return;
        spaceHeld = false;
        syncBraking();
        render();
      });

      pauseBtn.addEventListener("click", function () {
        if (mode === "playing" || mode === "teaching") enterPause("manual");
      });
      cardBtn.addEventListener("click", function () {
        if (mode === "paused") resume();
        else if (mode === "won" || mode === "lost") freshChallenge();
      });
      replayBtn.addEventListener("click", function () { beginTeach(levelId); });
      skipBtn.addEventListener("click", function () {
        if (mode === "teaching") freshChallenge();
      });
      menuBtn.addEventListener("click", function () { showMenu(); });
      startBtn.addEventListener("click", function () { beginChallenge(); });
      document.getElementById("teachMenu").addEventListener("click", function () { showMenu(); });
      var levelButtons = menu.querySelectorAll("button[data-level]");
      for (var bi = 0; bi < levelButtons.length; bi++) {
        levelButtons[bi].addEventListener("click", function (event) {
          beginTeach(event.currentTarget.getAttribute("data-level"));
        });
      }

      var blurArmed = document.hasFocus();
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          releaseInputs();
          if (mode === "playing" || mode === "teaching") enterPause("hidden");
          else render();
        }
      });
      window.addEventListener("focus", function () {
        blurArmed = true;
        lastTs = performance.now();
      });
      window.addEventListener("blur", function () {
        releaseInputs();
        if (!blurArmed) return;
        if (mode === "playing" || mode === "teaching") enterPause("blur");
        else render();
      });
      window.addEventListener("pageshow", function () { lastTs = performance.now(); });
      window.addEventListener("resize", function () { render(); });

      function frame(now) {
        var dt = Math.min(0.05, Math.max(0, (now - lastTs) / 1000));
        lastTs = now;
        if (!loopPaused) update(dt);
        render();
        requestAnimationFrame(frame);
      }

      applyLevel("normal");
      loadBest();
      showMenu();
      requestAnimationFrame(frame);

      if (debug) {
        window.__rt = {
          pauseLoop: function (on) { loopPaused = !!on; },
          advance: function (ms) { update(ms / 1000); render(); },
          setBraking: function (on) {
            debugBrake = on === null ? null : !!on;
            syncBraking();
            render();
          },
          pause: function () { if (mode === "playing") enterPause("manual"); },
          resume: function () { resume(); },
          restart: function () { restart(); },
          simLevel: function (id, mode) {
            var spec = LEVELS[id];
            return simFinal({
              yellow: spec.yellow,
              react: spec.react,
              limit: spec.limit || 30,
              move: spec.move,
              locks: spec.locks || [],
              events: spec.events || [],
              lights: spec.lights
            }, mode || "slow");
          },
          generateMix: function (seed) { return generateMix(seed >>> 0); },
          generateFinal: function (seed) { return generateFinal(seed >>> 0); },
          generateChallenge: function (seed) { return generateChallenge(seed >>> 0); },
          playSeed: function (seed) {
            forcedSeed = seed >>> 0;
            levelId = "final";
            freshChallenge();
          },
          playMix: function (seed) {
            forcedMix = seed >>> 0;
            levelId = "mix";
            freshChallenge();
          },
          playChallenge: function (seed) {
            forcedChallenge = seed >>> 0;
            levelId = "challenge";
            freshChallenge();
          },
          autoLevel: function (id, profile) {
            levelId = id;
            if (id === "challenge") {
              forcedChallenge = (profile && profile.seed != null ? profile.seed : 1) >>> 0;
            }
            if (id === "mix") {
              forcedMix = (profile && profile.seed != null ? profile.seed : 1) >>> 0;
            }
            freshChallenge();
            var delays = (profile && profile.hesitant)
              ? { event: 0.62, lamp: 0.5, yellowStop: 0.33, release: 0.55, yellowGo: 0.55 }
              : (profile && profile.slow)
                ? { event: 0.5, lamp: 0.35, yellowStop: 0, release: 0.45, yellowGo: 0.45 }
                : { event: 0.28, lamp: 0.28, yellowStop: 0.12, release: 0.26, yellowGo: 0.22 };
            var steps = 0;
            while (mode === "playing" && steps < 4500) {
              var info = phaseAt(elapsed);
              var ev = eventAt(elapsed);
              var lk = lockAt(elapsed);
              var age = elapsed - info.phase.t;
              var want;
              if (ev && ev.phase === "stop") want = true;
              else if (ev) want = (elapsed - ev.event.t) >= delays.event;
              else if (lk && lk.phase === "active" && lockSnap !== null) want = lockSnap;
              else if (lk && lk.phase === "active") want = braking;
              else if (info.phase.signal === "yellow") {
                var nr = info.next ? requiredOf(info.next) : "go";
                want = nr === "stop" ? age >= delays.yellowStop : (age < delays.yellowGo ? braking : false);
              } else if (requiredOf(info.phase) === "stop") want = age >= delays.lamp ? true : braking;
              else want = braking && age < delays.release ? true : false;
              debugBrake = want;
              syncBraking();
              stepOnce(0.02);
              steps++;
            }
            debugBrake = null;
            syncBraking();
            return {
              mode: mode,
              elapsed: Math.round(elapsed * 100) / 100,
              level: levelId,
              seed: levelId === "challenge" ? challengeSeed : levelId === "mix" ? mixSeed : finalSeed,
              limit: roundLimit(),
              result: result ? result.kind : "",
              detail: result ? result.detail : ""
            };
          },
          state: function () {
            var info = phaseAt(elapsed);
            var phase = info.phase;
            return {
              mode: mode,
              elapsed: elapsed,
              remaining: Math.max(0, roundLimit() - elapsed),
              progress: progress,
              signal: phase.signal,
              rule: phase.rule,
              required: requiredOf(phase),
              safe: !!phase.safe,
              braking: braking,
              moving: movingNow(),
              warning: mode === "playing" ? warningText() : "",
              protected: !!phase.safe || phase.signal === "yellow" || resumeGraceLeft > 0,
              graceLeft: resumeGraceLeft > 0 ? resumeGraceLeft : (phase.signal === "yellow" && info.next ? Math.max(0, info.next.t - elapsed) : 0),
              resumeGraceLeft: resumeGraceLeft,
              nextRequired: info.next ? requiredOf(info.next) : null,
              nextRule: info.next ? info.next.rule : null,
              nextSignal: info.next ? info.next.signal : null,
              phaseAge: elapsed - phase.t,
              phaseIndex: info.index,
              pausedReason: pausedReason,
              result: result,
              level: levelId,
              seed: levelId === "challenge" ? challengeSeed : levelId === "mix" ? mixSeed : finalSeed,
              limit: roundLimit(),
              teachStep: teach.step,
              teachReady: teach.ready,
              teachPhase: teach.phase,
              teachKind: (mode === "teaching" || pausedFrom === "teaching") && TEACH[levelId][teach.step] ? TEACH[levelId][teach.step].kind : "",
              teachForce: (mode === "teaching" || pausedFrom === "teaching") && TEACH[levelId][teach.step] ? !!TEACH[levelId][teach.step].force : false,
              preNumber: preLock.hidden ? "" : preNum.textContent,
              bestTimeMs: slot().bestTimeMs,
              bestProgress: slot().bestProgress,
              storageOk: storageOk,
              overlay: !overlay.hidden,
              ruleText: ruleCard.classList.contains("is-reverse") ? "反轉：紅行、綠停" : "正常：綠行、紅停",
              ruleReversed: ruleCard.classList.contains("is-reverse"),
              previewText: rulePreview.hidden ? "" : rulePreview.textContent,
              lampName: lampName.textContent,
              lockShown: !lockCard.hidden,
              lockHold: lockHold.textContent,
              lockCount: lockCount.textContent,
              dimmed: getComputedStyle(document.querySelector("#signal .housing")).opacity !== "1",
              lock: lockAt(elapsed) ? lockAt(elapsed).phase : "none",
              lockSnap: lockSnap,
              lockIndex: seenLock,
              broken: signal.classList.contains("is-broken"),
              event: (function () { var ev = eventAt(elapsed); return ev ? ev.event.id : ""; })(),
              eventPhase: (function () { var ev = eventAt(elapsed); return ev ? ev.phase : "none"; })(),
              eventAge: (function () { var ev = eventAt(elapsed); return ev ? elapsed - ev.event.t : 0; })(),
              eventTitle: (function () {
                var shown = eventVisual(elapsed);
                var id = shown ? shown.id : "";
                if (!id && (mode === "teaching" || pausedFrom === "teaching") && teachStep() && teachStep().kind === "event") id = teachStep().event;
                return id && EVENT_COPY[id] ? EVENT_COPY[id].title : "";
              })(),
              gust: car.classList.contains("is-gust"),
              bannerText: bannerText.textContent,
              cardTitle: cardTitle.textContent,
              cardDetail: cardDetail.textContent,
              cardKicker: cardKicker.textContent,
              cardBtn: cardBtn.textContent,
              pedalSub: pedalSub.textContent,
              bestText: bestLine.textContent,
              storageText: storageNote.hidden ? "" : storageNote.textContent
            };
          }
        };
      }
    })();
  </script>
</body>
</html>
